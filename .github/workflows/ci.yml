name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish default-branch deployments; cancel superseded PR/feature validation.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test-and-build:
    name: Test and build bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Check formatting
        run: |
          npm run format:check
          npx prettier --check .github/workflows

      - name: Restore Metro transform cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/metro-cache
          key: ${{ runner.os }}-metro-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-metro-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}-

      # Bundle validation only: no native signing, Expo account or store secrets.
      - name: Export iOS and Android bundles
        env:
          # runner is available in step env; keep Metro aligned with the cached path.
          TMPDIR: ${{ runner.temp }}
        run: npx expo export --platform ios --platform android --output-dir dist

      - name: Upload app bundles
        uses: actions/upload-artifact@v7
        with:
          name: aquaair-app-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload static website
        uses: actions/upload-artifact@v7
        with:
          name: aquaair-website
          path: |
            web/*.html
            web/*.css
            web/assets/
          if-no-files-found: error
          retention-days: 7

      - name: Package website for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  build-apk:
    name: Build standalone preview APK
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
      NODE_ENV: production
      AQUAAIR_PREVIEW_BUILD: "1"
      AQUAAIR_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies including build tools
        run: npm ci --include=dev

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the retired "tools" SDK package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle and build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Create temporary preview signing key
        env:
          PREVIEW_KEYSTORE: ${{ runner.temp }}/aquaair-preview.jks
        run: |
          keytool -genkeypair -noprompt -keystore "$PREVIEW_KEYSTORE" \
            -storepass aquaair-preview -keypass aquaair-preview \
            -alias aquaair-preview -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Aqua Air CI Preview"

      # CI-only signing; the .preview package cannot replace production installs.
      - name: Build APK with embedded JavaScript
        working-directory: android
        env:
          AQUAAIR_ANDROID_KEYSTORE: ${{ runner.temp }}/aquaair-preview.jks
          AQUAAIR_ANDROID_KEYSTORE_PASSWORD: aquaair-preview
          AQUAAIR_ANDROID_KEY_ALIAS: aquaair-preview
          AQUAAIR_ANDROID_KEY_PASSWORD: aquaair-preview
        run: >-
          ./gradlew :app:assembleRelease --no-daemon --build-cache --max-workers=2
          -PreactNativeArchitectures=arm64-v8a,x86_64
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Name APK and record checksum
        env:
          PREVIEW_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/android/Aqua-Air-Preview-${PREVIEW_BUILD_NUMBER}.apk"
          cd artifacts/android
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload preview APK
        uses: actions/upload-artifact@v7
        with:
          name: aquaair-preview-apk
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary signing key
        if: always()
        env:
          PREVIEW_KEYSTORE: ${{ runner.temp }}/aquaair-preview.jks
        run: rm -f "$PREVIEW_KEYSTORE"

  deploy-website:
    name: Deploy website to GitHub Pages
    needs: test-and-build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
